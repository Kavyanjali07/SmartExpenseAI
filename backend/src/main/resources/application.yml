spring:
  profiles:
    default: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}

server:
  port: 8080

jwt:
  # Supply a strong, randomly generated secret via the environment.
  # Never commit signing keys or production credentials to source control.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
  temperature: ${OPENAI_TEMPERATURE:0.2}

app:
  ai:
    cache-ttl-seconds: ${AI_CACHE_TTL_SECONDS:900}
